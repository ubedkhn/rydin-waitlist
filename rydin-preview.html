/* Scroll-reveal via IntersectionObserver — the hand-rolled stand-in for

function Reveal({ children, className = "", delay = 0, as = "div" }) {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setSeen(true); obs.disconnect(); } },
      { rootMargin: "-10% 0px -10% 0px" }

    return () => obs.disconnect();

}

/* Count-up that eases to its target and re-animates when the value changes. */
function AnimatedNumber({ value, format = (n) => formatCount(n), durationMs = 900 }) {
  const [display, setDisplay] = useState(value);
  const fromRef = useRef(value);
  const rafRef = useRef(0);
  useEffect(() => {
    const from = fromRef.current;
    const to = value;
    if (from === to) return;
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / durationMs);
      const eased = 1 - Math.pow(2, -10 * t);
      const current = from + (to - from) * (t >= 1 ? 1 : eased);
      setDisplay(current);
      fromRef.current = current;
      if (t < 1) rafRef.current = requestAnimationFrame(tick);
      else { fromRef.current = to; setDisplay(to); }
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [value, durationMs]);
  return format(Math.round(display));
}

/* ================================================================== *
 * Shared waitlist state
 * ================================================================== */
const WaitlistContext = createContext(null);
const useWaitlist = () => {
  const ctx = useContext(WaitlistContext);
  if (!ctx) throw new Error("useWaitlist must be used inside <WaitlistProvider>.");
  return ctx;
};

function WaitlistProvider({ children }) {
  const [pass, setPass] = useState(null);
  const [hydrated, setHydrated] = useState(false);
  const [queueCount, setQueueCount] = useState(QUEUE.baseCount);

  useEffect(() => { setPass(readPass()); setHydrated(true); }, []);

  useEffect(() => {
    let timer;
    const schedule = () => {
      timer = setTimeout(() => {
        if (!document.hidden) setQueueCount((c) => c + 1 + Math.floor(Math.random() * 3));
        schedule();
      }, 3200 + Math.random() * 4200);
    };
    schedule();
    return () => clearTimeout(timer);
  }, []);

  const join = useCallback((draft) => {
    const hub = findHub(draft.hubId);
    const seed = makeIdentitySeed(draft.fullName, draft.mobile);
    const record = {
      version: 1, mode: draft.mode, fullName: draft.fullName.trim(), mobile: draft.mobile.replace(/\D/g, ""),
      hubId: hub.id, hubLabel: hub.label, hubCode: hub.code, customRoute: draft.customRoute.trim(),
      institutionalEmail: draft.institutionalEmail.trim(), institutionVerified: isInstitutionalEmail(draft.institutionalEmail),
      womenOnlyMatching: draft.womenOnlyMatching, passId: makePassId(seed), referralCode: makeReferralCode(seed),
      basePosition: makeBasePosition(seed), referrals: 0, joinedAt: new Date().toISOString(),
    };
    setPass(record); writePass(record); setQueueCount((c) => c + 1);
    return record;
  }, []);

  const addReferral = useCallback(() => {
    setPass((current) => { if (!current) return current; const next = { ...current, referrals: current.referrals + 1 }; writePass(next); return next; });
  }, []);
  const reset = useCallback(() => { clearPass(); setPass(null); }, []);
  const lookup = useCallback((query) => {
    const stored = pass || readPass();
    if (!stored) return null;
    const trimmed = query.trim().toLowerCase();
    if (!trimmed) return null;
    const digits = trimmed.replace(/\D/g, "");
    if (digits.length >= 10 && stored.mobile === digits.slice(-10)) return stored;
    if (trimmed.includes("@") && stored.institutionalEmail.toLowerCase() === trimmed) return stored;
    return null;
  }, [pass]);
  const focusForm = useCallback(() => {
    const node = document.getElementById("waitlist");
    if (node) node.scrollIntoView({ behavior: "smooth", block: "center" });
    setTimeout(() => { const el = document.getElementById("rydin-name"); if (el) el.focus({ preventScroll: true }); }, 520);
  }, []);

  const standing = useMemo(() => (pass ? computeStanding(pass) : null), [pass]);
  const value = { pass, standing, hydrated, queueCount, join, addReferral, reset, lookup, focusForm };
  return <WaitlistContext.Provider value={value}>{children}</WaitlistContext.Provider>;
}

function SpotLookupModal({ open, onClose }) {
  const { lookup } = useWaitlist();
  const [query, setQuery] = useState("");
  const [result, setResult] = useState("idle");
  const [record, setRecord] = useState(null);
  useEffect(() => {
    if (!open) return;
    setQuery(""); setResult("idle"); setRecord(null);
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
  }, [open, onClose]);
  if (!open) return null;
  const submit = (e) => {
    e.preventDefault();
    const found = lookup(query);
    setRecord(found); setResult(found ? "found" : "missing");
  };
  const standing = record ? computeStanding(record) : null;
  return (
    <div className="fixed inset-0 z-[60] grid place-items-center p-4" style={{ animation: "none" }}>
      <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} style={{ opacity: 1 }}></div>
      <div className="relative w-full max-w-md rounded-3xl bg-ink-raise/90 p-6 shadow-glass ring-hairline backdrop-blur-xl sm:p-7" role="dialog" aria-modal="true" aria-label="Check your waitlist spot">

          <Icons.X className="h-4 w-4" strokeWidth={2.2} />
        </button>
        <h2 className="text-lg font-bold text-zinc-50">Check your spot</h2>
        <p className="mt-1 text-sm text-zinc-400">Enter the mobile number or email you joined with.</p>
        <form onSubmit={submit} className="mt-5">
          <input value={query} onChange={(e) => setQuery(e.target.value)} autoFocus placeholder="98765 43210 or you@campus.ac.in"
            className="w-full rounded-xl bg-black/30 px-4 py-3 text-sm text-zinc-100 placeholder:text-zinc-600 ring-hairline focus:ring-2 focus:ring-emerald-400/70" />
          <Tactile type="submit" className="mt-3 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-b from-emerald-400 to-emerald-600 px-4 py-3 text-sm font-semibold text-white shadow-emerald-sm">
            <Icons.Search className="h-4 w-4" strokeWidth={2.3} /> Find my pass
          </Tactile>
        </form>
        {result === "found" && standing && (
          <div className="mt-5 rounded-2xl bg-emerald-500/[0.08] p-4 ring-1 ring-emerald-400/20">
            <p className="text-xs text-emerald-200/80">Pass {record.passId}</p>
            <p className="mt-1 font-mono text-3xl font-bold text-emerald-200" data-numeric>#{formatCount(standing.currentPosition)}</p>
            <p className="mt-1 text-xs text-zinc-400">{passRoute(record)} · joined {passIssuedOn(record)}</p>
          </div>
        )}
        {result === "missing" && (
          <p className="mt-5 rounded-2xl bg-black/25 p-4 text-xs leading-relaxed text-zinc-400 ring-hairline">
            No pass found for that. Passes in this preview are stored in this browser only, so a pass created on another device won't appear here.
          </p>
        )}
      </div>
    </div>
  );
}

function WaitlistCard() {
  const { pass, standing, hydrated, join, addReferral, reset } = useWaitlist();
  const [draft, setDraft] = useState(EMPTY_DRAFT);
  const [step, setStep] = useState(0);
  const [errors, setErrors] = useState({});
  const [submitting, setSubmitting] = useState(false);

  const set = (key, value) => {
    setDraft((d) => ({ ...d, [key]: value }));
    setErrors((e) => { if (!(key in e)) return e; const next = { ...e }; delete next[key]; return next; });
  };
  const goNext = () => {
    const stepErrors = validateStep(step, draft);
    if (hasErrors(stepErrors)) { setErrors(stepErrors); return; }
    setErrors({}); setStep((s) => Math.min(STEPS.length - 1, s + 1));
  };
  const goBack = () => { setErrors({}); setStep((s) => Math.max(0, s - 1)); };
  const submit = async () => {
    const all = validateAll(draft);
    if (hasErrors(all)) {
      setErrors(all);
      const firstBad = [0, 1, 2].find((s) => hasErrors(validateStep(s, draft)));
      if (firstBad !== undefined) setStep(firstBad);
      return;
    }
    setSubmitting(true);
    await new Promise((r) => setTimeout(r, 620));
    join(draft);
    setSubmitting(false);
  };

  if (!hydrated) return <CardSkeleton />;
  if (pass && standing) return <QueuePass pass={pass} standing={standing} addReferral={addReferral} reset={reset} />;

  const hub = findHub(draft.hubId);
  const emailIsInstitutional = draft.institutionalEmail.trim() && isInstitutionalEmail(draft.institutionalEmail);

                  <m.icon className={cn("relative h-4 w-4 shrink-0", active ? "text-white" : "text-zinc-500")} strokeWidth={2.2} />
                  <span className="relative text-center leading-tight">

      const el = document.getElementById("rydin-referral-link");
      if (el) { const r = document.createRange(); r.selectNode(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

          {standing.totalJump > 0 && (
            <span className="mt-3 inline-flex items-center gap-1.5 rounded-full bg-amber-500/15 px-2.5 py-1 text-[11px] font-semibold text-amber-300 ring-1 ring-amber-400/20">

          )}

          <div className="mt-5 flex flex-wrap gap-2">

        </div>

        {/* Tear line */}
        <div className="relative h-6">
          <span className="stub-notch stub-notch-left top-1/2 -translate-y-1/2"></span>

        {/* Lower stub */}

                : <React.Fragment><Icons.Share2 className="h-4 w-4 text-emerald-300" strokeWidth={2.2} /> Share</React.Fragment>}
            </Tactile>
          </div>

            <button onClick={reset} className="ml-auto text-[11px] text-zinc-500 underline-offset-4 hover:text-zinc-300 hover:underline">Leave the queue</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function FeeBar({ label, pct, tone, value }) {
  const ref = useRef(null); const [seen, setSeen] = useState(false);
  useEffect(() => { const el = ref.current; if (!el) return; const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); o.disconnect(); } }, { rootMargin: "-5% 0px" }); o.observe(el); return () => o.disconnect(); }, []);
  return (
    <div ref={ref}>
      <div className="flex items-baseline justify-between text-[11px]"><span className="text-zinc-400">{label}</span><span className={cn("font-mono font-semibold", tone === "emerald" ? "text-emerald-300" : "text-zinc-400")}>{value}</span></div>

    </div>
  );
}

function StickyCta() {
  const { pass, standing, queueCount, focusForm } = useWaitlist();
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const target = document.getElementById("waitlist");
    if (!target) return;
    const observer = new IntersectionObserver(([entry]) => setVisible(!entry.isIntersecting), { rootMargin: "-72px 0px 0px 0px", threshold: 0 });
    observer.observe(target);
    return () => observer.disconnect();
  }, []);
  return (
    <div className={cn("fixed inset-x-0 bottom-0 z-40 px-3 pb-3 transition-all duration-300 sm:px-5 sm:pb-4", visible ? "translate-y-0 opacity-100" : "pointer-events-none translate-y-24 opacity-0")}>
